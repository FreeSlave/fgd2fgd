name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
          # - os: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install fmt on Ubuntu
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        sudo apt-get update
        sudo apt-get install -y libfmt-dev

    # - name: Install fmt on Windows
    #   if: startsWith(matrix.os, 'windows')
    #   run: vcpkg install fmt

    - name: Build on Ubuntu
      if: startsWith(matrix.os, 'ubuntu')
      run: |
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -B build -S .
        cmake --build build --target all

    # - name: Build on Windows
    #   if: startsWith(matrix.os, 'windows')
    #   run: |
    #     cmake -DCMAKE_BUILD_TYPE=Release -B build -S . -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
    #     cmake --build build --target all
